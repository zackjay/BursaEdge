name: Uji Android (emulator)

# Bina APK x86_64, jalankan dalam emulator Android, lalui skrin permulaan dan
# simpan log crash + tangkapan skrin sebagai artifak.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/uji-android.yml'
      - '.github/skrip/uji-emulator.sh'

permissions:
  contents: write

concurrency:
  group: uji-android
  cancel-in-progress: true

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    env:
      BURSAEDGE_DATA_REPO: ${{ github.repository }}
      BURSAEDGE_DATA_BRANCH: ${{ github.event.repository.default_branch }}
      BURSAEDGE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang kebergantungan
        working-directory: app
        run: npm ci

      - name: Jana projek Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Bina APK release (x86_64 untuk emulator)
        working-directory: app/android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ujian-log"
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 2>&1 | tee "$GITHUB_WORKSPACE/ujian-log/gradle.txt" | tail -60

      - name: Hidupkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan dalam emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/skrip/uji-emulator.sh

      - name: Terbitkan log ke cawangan ujian-log
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p ujian-log && cd ujian-log
          tail -400 gradle.txt > gradle-ekor.txt 2>/dev/null || true
          rm -f gradle.txt
          echo "run ${{ github.run_id }} commit ${{ github.sha }} $(date -u)" > INFO.txt
          git init -q -b "ujian-log-${{ matrix.api }}"
          git config user.name "bursaedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Log ujian ${{ github.run_number }} API ${{ matrix.api }} [skip ci]"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "ujian-log-${{ matrix.api }}"
