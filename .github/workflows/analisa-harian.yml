name: Analisa Harian

# Berjalan sendiri setiap hari bekerja selepas Bursa tutup (5:00 ptg MYT).
# 10:17 UTC = 6:17 ptg dan 13:47 UTC = 9:47 mlm waktu Malaysia (larian sandaran).
# Jadual GitHub kerap lewat beberapa jam; larian kedua bagi tarikh yang sama
# hanya menyegarkan data (tiada notifikasi berulang).
on:
  schedule:
    - cron: '17 10 * * 1-5'
    - cron: '47 13 * * 1-5'
  workflow_dispatch:
    inputs:
      paksa_notifikasi:
        description: 'Hantar semula notifikasi Telegram/ntfy walaupun tarikh ini sudah dimaklumkan'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/analisa-harian.yml'

permissions:
  contents: write

concurrency:
  group: analisa-harian
  cancel-in-progress: false

jobs:
  analisa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Pasang kebergantungan
        run: pip install -r engine/requirements.txt

      - name: Jalankan enjin BursaEdge
        working-directory: engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NOTIFIKASI_HORIZON: ${{ vars.NOTIFIKASI_HORIZON }}
          NOTIFIKASI_SISI: ${{ vars.NOTIFIKASI_SISI }}
          NOTIFIKASI_HAD_KEDUDUKAN: ${{ vars.NOTIFIKASI_HAD_KEDUDUKAN }}
          PAUTAN_APP: https://github.com/${{ github.repository }}
          PAKSA: ${{ inputs.paksa_notifikasi }}
        run: |
          ARGS=""
          if [ "$PAKSA" = "true" ]; then ARGS="--paksa-notifikasi"; fi
          python -m bursaedge.jalan $ARGS --carta "$GITHUB_WORKSPACE/carta_keluar"

      - name: Terbitkan keputusan ke repo
        run: |
          git config user.name "bursaedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tiada perubahan data."
            exit 0
          fi
          TARIKH=$(python -c "import json;print(json.load(open('data/latest.json'))['tarikh_data'])")
          git commit -m "Analisa ${TARIKH} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Gagal menolak keputusan" >&2
          exit 1

      - name: Terbitkan data graf ke cawangan carta
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d carta_keluar ] || { echo "Tiada data graf"; exit 0; }
          cd carta_keluar
          TARIKH=$(python -c "import json,glob;print(json.load(open(sorted(glob.glob('*.json'))[0]))['tarikh_data'])")
          git init -q -b carta
          git config user.name "bursaedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Graf ${TARIKH} [skip ci]"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" carta
          echo "Cawangan carta dikemas kini ($(ls *.json | wc -l) fail)"
